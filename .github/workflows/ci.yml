name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # the latest patch release: go.mod's "go 1.26.0" would install an old
          # standard library with known vulnerabilities (govulncheck)
          go-version: '1.26'
          check-latest: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./... && go vet -tags integration ./...

      # Known vulnerabilities in code paths cpictl actually calls
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # Offline tests against an in-memory mock tenant; also checks that
      # docs/commands.md and docs/examples are up to date.
      - name: test
        run: go test -race ./...

      # Cross-package coverage of the offline suite; fails below the floor
      - name: coverage
        run: |
          go test -coverpkg=./... -coverprofile=coverage.out ./... > /dev/null
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t < 50) }' || (echo "coverage below 50%" && exit 1)

      - name: build
        run: make build && ./bin/cpictl --version

  # The suite on Windows (release binaries are built for it).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: test
        run: go test ./...

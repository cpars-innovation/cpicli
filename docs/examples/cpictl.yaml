# cpictl global config file
# Use as $HOME/cpictl.yaml, point CPICTL_CONFIG at it, or pass it with --config.
#
# Precedence: flag > CPICTL_* environment variable > top-level key > command section > default.
# Secrets may be stored here in a personal file: chmod 600 it (cpictl warns otherwise) and
# never commit it. ${VAR} is NOT expanded in this file.

# --- Tenant connection --------------------------------------------------------
tmn-host: mytenant.it-cpi018.cfapps.eu10-003.hana.ondemand.com
oauth-host: mytenant.authentication.eu10.hana.ondemand.com
# oauth-clientid: sb-xxxxxxxx!b1234|it!b5678
# oauth-clientsecret: ...            # only in a chmod 600 personal file

# Runtime endpoints (cpictl send / send_test_message), service key of plan integration-flow:
# runtime-oauth-clientid: ...
# runtime-oauth-clientsecret: ...

# Basic Auth instead of OAuth:
# tmn-userid: ...
# tmn-password: ...                  # only in a chmod 600 personal file

# output: json          # default output format for all commands
# debug: false
# read-retries: 3       # retries of throttled reads (429, 502-504); writes are never retried
# summary: off          # job summary file (default: $GITHUB_STEP_SUMMARY when set)

# The values below are the defaults (docs/configuration.md#defaults); keep only what you change.

# --- deploy / undeploy --------------------------------------------------------
deploy:
  artifactType: Integration   # Integration, MessageMapping, ScriptCollection, ValueMapping
  compareVersions: true       # skip artifacts whose version is already running
  delayLength: 10             # seconds between status checks (one runtime list for all deployments)
  timeout: 10m                # wait at most this long for all deployments together (docs/deployments.md)
  parallelDeployments: 5      # deploy --pending: deployments at the same time per package
  # artifactIds: [MyIFlow, MyOtherIFlow]

undeploy:
  delayLength: 10
  maxCheckLimit: 30

# --- configure (see docs/configure.md) ----------------------------------------
configure:
  configPath: ./config/dev.yml
  parallel: 8                 # parameter reads at the same time
  batchSize: 90
  deployTimeout: 10m
  deployDelaySeconds: 10
  parallelDeployments: 5
  pull:
    outputDir: ./config/dev
    parallel: 8

# --- orchestrator (see docs/orchestrator.md) ----------------------------------
orchestrator:
  packagesDir: ./packages
  deployConfig: ./001-deploy-config.yml
  mode: update-and-deploy     # update-and-deploy, update-only, deploy-only
  deploymentPrefix: ""
  parallel: 8                 # uploads at the same time, across packages
  # snapshotState: .cpi/snapshot-state.json   # default: found automatically; off: always download
  verifyDownload: false
  draftHandling: SKIP         # artifacts in draft on the tenant: SKIP (reported) or ERROR (exit 5)
  parallelDeployments: 5      # triggered at a time; all are watched together
  deployTimeout: 10m          # for all deployments of the run together
  deployDelaySeconds: 10

# --- snapshot (see docs/snapshot.md) -------------------------------------------
snapshot:
  parallel: 8                 # downloads at the same time, across packages
  incremental: false          # true: skip unchanged artifacts (see docs/snapshot.md)
  draftHandling: SKIP         # SKIP, ADD (written with a numeric Bundle-Version), ERROR
  keepOrphanParameters: false # true: also write parameters.prop keys parameters.propdef no longer declares

drift:
  parallel: 8

# --- Partner Directory (see docs/partner-directory.md) ------------------------
pd-snapshot:
  resources-path: ./partner-directory
  replace: true

pd-deploy:
  resources-path: ./partner-directory
  replace: true
  full-sync: false
  dry-run: false
